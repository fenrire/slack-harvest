# 출력 폴더명으로 사용할 워크스페이스 별칭(고정).
# 미설정 시 auth.test의 team명을 자동 사용한다.
# Slack 워크스페이스 이름이 바뀌어도 폴더가 갈라지지 않도록 고정한다.
# (auth.test team명이 이 값과 다르면 fetch 시 변경 경고 출력)
workspace: "위메이드"

# WCM(Windows Credential Manager) 크레덴셜 식별자
# 실제 시크릿은 KeePassXC → Load-Secrets → WCM에 저장됨
# 이 파일은 시크릿 값을 포함하지 않으므로 git에 커밋 가능
credentials:
  slack:
    keyring_service: "claude-code:slack"
    keys:
      token: "user-token"         # KeePassXC slack/user-token → Password
    env_vars:
      token: "SLACK_USER_TOKEN"

  gemini:
    keyring_service: "claude-code:google"
    keys:
      api_key: "gemini-api-key"   # KeePassXC google/gemini-api-key → Password
    env_vars:
      api_key: "GOOGLE_GEMINI_API_KEY"
